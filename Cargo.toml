[workspace]
resolver = "3"
members = ["crates/shacl", "crates/shacl-cli", "crates/shacl-python"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwin/SHACL_Engine"

[workspace.dependencies]
oxrdf = { version = "0.3", features = ["oxsdatatypes", "rdfc-10"] }
oxrdfio = { version = "0.2", features = ["rdf-12"] }
oxsdatatypes = "0.2"
# `sparql-12` must track oxrdf's `rdf-12`: enabling triple terms in the term
# model without it leaves the SPARQL crates unable to match on `Term::Triple`.
spargebra = { version = "0.4", features = ["sparql-12"] }
spareval = { version = "0.2", features = ["sparql-12"] }
rayon = "1.12"
hashbrown = "0.16"
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Optimised profile for the benchmark / release binaries: SHACL validation is
# dominated by index probing, so LTO + a single codegen unit pay off well.
[profile.release]
lto = "fat"
codegen-units = 1
# Symbols are worth a few megabytes and nothing else in a shipped binary.
strip = true
# Unwinding is deliberate. `panic = "abort"` would be marginally smaller, but
# `panic` cannot be set per package, and the Python extension needs unwinding:
# PyO3 turns a panic into a Python exception by catching it. Aborting would take
# the whole interpreter down instead.

# `bench` inherits from release.
[profile.bench]
lto = "fat"
codegen-units = 1
