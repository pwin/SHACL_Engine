[workspace]
resolver = "3"
members = [
    "crates/shacl",
    "crates/shacl-cli",
    "crates/shacl-python",
    "crates/shacl-wasm",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwin/SHACL_Engine"

[workspace.dependencies]
oxrdf = { version = "0.3", features = ["oxsdatatypes", "rdfc-10"] }
oxrdfio = "0.2"
oxsdatatypes = "0.2"
# RDF 1.2 (`rdf-12`, `sparql-12`) is a feature of the `shacl` crate, on by
# default: see its Cargo.toml. It is not set here, so that a build can leave it off.
spargebra = "0.4"
spareval = "0.2"
rayon = "1.12"
hashbrown = "0.16"
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Optimised profile for the benchmark / release binaries: SHACL validation is
# dominated by index probing, so LTO + a single codegen unit pay off well.
[profile.release]
lto = "fat"
codegen-units = 1
# Symbols are worth a few megabytes and nothing else in a shipped binary.
strip = true
# Unwinding is deliberate. `panic = "abort"` would be marginally smaller, but
# `panic` cannot be set per package, and the Python extension needs unwinding:
# PyO3 turns a panic into a Python exception by catching it. Aborting would take
# the whole interpreter down instead.

# `bench` inherits from release.
[profile.bench]
lto = "fat"
codegen-units = 1
