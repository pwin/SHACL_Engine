[package]
name = "shacl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A high-performance SHACL validation engine"

[dependencies]
oxrdf.workspace = true
oxrdfio.workspace = true
oxttl = { version = "0.2", features = ["rdf-12"] }
oxsdatatypes.workspace = true
spargebra.workspace = true
spareval.workspace = true
rayon.workspace = true
hashbrown.workspace = true
regex.workspace = true
foldhash = "0.2"
# `rust_backend` keeps this pure Rust: no zlib to find at link time, which
# matters for the three-platform release builds.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }


[dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
anyhow.workspace = true
