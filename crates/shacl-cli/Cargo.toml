[package]
name = "shacl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line interface for the shacl validation engine"

[[bin]]
name = "shacl"
path = "src/main.rs"

[dependencies]
shacl = { path = "../shacl" }
clap.workspace = true
anyhow.workspace = true
mimalloc = { version = "0.1", default-features = false }
# `rustls` rather than the platform TLS: the release builds run on three
# operating systems, and linking OpenSSL would make each of them a separate
# problem. `gzip` because published RDF is usually compressed — most large
# dumps ship as `.ttl.gz`, and servers negotiate gzip as a matter of course.
# JSON support is left out; that one really is of no use here.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
