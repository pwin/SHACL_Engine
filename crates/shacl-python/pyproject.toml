[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "shacl"
description = "A high-performance SHACL validator"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Peter Winstanley" }]
keywords = ["shacl", "rdf", "validation", "semantic-web", "sparql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/pwin/SHACL_Engine"
Issues = "https://github.com/pwin/SHACL_Engine/issues"
Changelog = "https://github.com/pwin/SHACL_Engine/releases"

[tool.maturin]
# The extension is built from the workspace member, and targets the stable ABI
# so one wheel serves every CPython from 3.9 up.
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "shacl"
