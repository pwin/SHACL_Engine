name: release

# Tag a commit `v0.1.0` to cut a release. Artefacts are built natively on each
# platform rather than cross-compiled, so every binary and wheel is tested on
# the system it targets before it ships.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Upload the distributions to an index (run this against a tag, not a branch)"
        type: boolean
        default: false
      pypi_repository:
        description: "Which index. Rehearse on testpypi first: a version can never be re-uploaded."
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      publish_to_npm:
        description: "Publish the WebAssembly packages to npm (run this against a tag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # `shacl-python` is excluded because it contains no Rust tests, and
      # building it here would link against libpython for no benefit — the
      # `wheels` job builds it properly with `extension-module` and runs its
      # pytest suite on every platform. Clippy and rustfmt still cover it,
      # since neither links.
      - run: cargo test --workspace --exclude shacl-python
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check

  cli:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Apple Silicon only. `macos-13` was the last free Intel runner and
          # has been removed; the surviving Intel labels are large runners,
          # which are billed even on public repositories. Intel Mac users can
          # build the CLI from source, and the Python wheel below is universal
          # so it covers them regardless.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p shacl-cli --target ${{ matrix.target }}
      # A binary that cannot report its own version did not link correctly.
      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/shacl${{ matrix.ext }} --version
      # Archived rather than shipped bare, for two reasons: a raw file
      # downloaded from a release arrives without its executable bit, and the
      # licences have to travel with the binary.
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION=dev
          NAME="shacl-$VERSION-${{ matrix.target }}"
          mkdir -p "staging/$NAME" dist
          cp "target/${{ matrix.target }}/release/shacl${{ matrix.ext }}" "staging/$NAME/"
          cp LICENSE-MIT LICENSE-APACHE README.md "staging/$NAME/"
          cd staging
          if [ -n "${{ matrix.ext }}" ]; then
            7z a -tzip "../dist/$NAME.zip" "$NAME" >/dev/null
          else
            tar czf "../dist/$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # One universal2 wheel covers both Mac architectures, which is what
          # lets the Intel runner go without leaving Intel users behind.
          - os: macos-latest
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # One abi3 wheel per platform serves every CPython from 3.9 up, so the
      # matrix is over operating systems rather than interpreter versions.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path crates/shacl-python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: auto
      # `--no-index` matters: `shacl` is a plausible name for an unrelated
      # project on PyPI, and without it a failed local build would quietly test
      # somebody else's package instead.
      - name: Smoke test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist --force-reinstall shacl
          python -m pip install pytest
          python -m pytest crates/shacl-python/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # PyPI expects a source distribution alongside the wheels, so anyone on a
  # platform with no wheel can still build from source. Only one is needed, so
  # it is not part of the per-OS matrix.
  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/shacl-python/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [cli, wheels, sdist]
    runs-on: ubuntu-latest
    # Only on a tag push. A manual dispatch is how the PyPI upload is driven,
    # and that has to be run against an existing tag — without this guard it
    # would also rewrite the release that tag already published.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staged
      # Collected by artefact directory rather than by filename. Each upload
      # lands in its own subdirectory, so this cannot accidentally pick up or
      # miss a file the way matching on `shacl-*` would.
      - name: Collect and checksum
        run: |
          mkdir -p dist
          cp staged/cli-*/* staged/wheels-*/*.whl staged/sdist/*.tar.gz dist/
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Deliberately not triggered by the tag. A PyPI upload cannot be undone —
  # yanking hides a version but never frees it for re-use — so publishing is a
  # separate, explicit act. Run this workflow manually with `publish_to_pypi`
  # set, after the release artefacts have been looked at.
  #
  # Authentication is Trusted Publishing: PyPI is configured to trust this
  # repository and workflow, and the job exchanges a short-lived OIDC token for
  # upload rights. No API token is stored anywhere.
  pypi:
    needs: [cli, wheels, sdist]
    if: inputs.publish_to_pypi
    runs-on: ubuntu-latest
    # The environment name follows the chosen index, so each can carry its own
    # protection rules and reviewers.
    environment: ${{ inputs.pypi_repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: staged
      # Only the Python distributions. The CLI archives are also `.tar.gz` and
      # must not be uploaded to PyPI, so this takes them from the artefact
      # directories that hold Python builds rather than filtering by name.
      - name: Collect distributions
        run: |
          mkdir -p dist
          cp staged/wheels-*/*.whl staged/sdist/*.tar.gz dist/
          ls -la dist
      # Real PyPI must come from a tag: dispatching from a branch would upload
      # whatever that branch currently holds, under the version in Cargo.toml,
      # which need not be what the tag of that version published. TestPyPI is
      # disposable, so a rehearsal may run from anywhere — and has to be able
      # to, since a workflow_dispatch uses the workflow file from the ref it is
      # given, so a tag cut before this job existed cannot run it.
      - name: Check the ref suits the index
        env:
          INDEX: ${{ inputs.pypi_repository }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "publishing $GITHUB_REF_NAME to $INDEX" ;;
            *) if [ "$INDEX" = "pypi" ]; then
                 echo "::error::Publishing to PyPI needs a tag, not $GITHUB_REF_NAME"; exit 1
               fi
               echo "::warning::Rehearsing $GITHUB_REF_NAME on $INDEX; only a tag may reach PyPI" ;;
          esac
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.pypi_repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  # The WebAssembly packages. Deliberately not triggered by the tag, for the
  # same reason as `pypi`: an npm version cannot be re-published, and unpublish
  # is only allowed for 72 hours and only when nothing depends on it.
  #
  # Two packages come out of one crate, because wasm-pack's two targets are not
  # interchangeable: `shacl-wasm` is ESM for bundlers, `shacl-wasm-node` is
  # CommonJS for `require()`. They are built here rather than taken from a
  # checked-in `pkg-*` directory, so what is published is what this commit
  # produces.
  npm:
    needs: [test]
    if: inputs.publish_to_npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance: npm records a signed link from the tarball back to this
      # workflow run and commit. Worth having for a package whose payload is a
      # 3 MB binary nobody can read.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # A tag, for the same reason PyPI needs one: the version published comes
      # from Cargo.toml, and only a tag ties that number to a commit anyone can
      # find again. npm has no disposable rehearsal registry to relax this for.
      - name: Check the ref suits a publish
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "publishing $GITHUB_REF_NAME to npm" ;;
            *) echo "::error::Publishing to npm needs a tag, not $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Build both packages
        run: node crates/shacl-wasm/build.mjs

      # `--access public` is explicit rather than relied upon: these names are
      # unscoped and so public by default, but the flag means a later move to a
      # scope does not silently publish a private package instead.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in pkg-bundler pkg-node; do
            echo "=== $dir ==="
            (cd "crates/shacl-wasm/$dir" && npm publish --provenance --access public)
          done
